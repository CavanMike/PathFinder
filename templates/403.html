{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Access denied</h1>
  <p>You do not have permission to open this page.</p>
  {% if user.is_authenticated %}
    <a class="btn" href="{% url 'dashboard:home' %}">Go to my dashboard</a>
  {% else %}
    <a class="btn" href="{% url 'accounts:login' %}">Log in</a>
  {% endif %}
</section>
{% endblock %}
